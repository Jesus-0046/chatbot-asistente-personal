# docker-compose production (Fase 10.1). Despliegue 24/7: PostgreSQL persistente
# + servicio de migraciones (una vez) + bot Telegram/WhatsApp (24/7) + API Web.
#
# Uso:
#   cp .env.example .env   # y rellena SECRETOS sin usar los defaults de ejemplo
#   docker compose up -d --build
#
# La DB no se expone al exterior por defecto (interruptor POSTGRES_PORT); el
# HTTPS/API se sirve a travÃ©s de un reverse proxy (ver DEPLOYMENT.md).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER (ver .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD (ver .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB (ver .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Defina POSTGRES_USER} -d ${POSTGRES_DB:?Defina POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build: .
    restart: "no"
    env_file:
      - .env
    environment: &datos
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?Defina POSTGRES_USER}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?Defina POSTGRES_DB}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment: *datos
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python -m asistente.main' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *datos
      API_ENABLED: "true"
      API_HOST: "0.0.0.0"
    command: ["python", "-m", "asistente.api"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata: